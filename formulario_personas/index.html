<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de personas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Registro de personas</h1>
      <p>Ingresa los datos y guarda cada registro.</p>
    </header>

    <form id="personForm">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan" required maxlength="60">
      </div>
      <div class="field">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" placeholder="Ej. Pérez" required maxlength="60">
      </div>
      <div class="field">
        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" placeholder="Ej. 25" min="0" max="120" required>
      </div>
      <button type="submit">Guardar registro</button>
    </form>

    <section class="records">
      <div class="records-heading">
        <h2>Personas registradas</h2>
        <button type="button" id="clearButton" class="secondary">Eliminar todos</button>
      </div>
      <p id="emptyMessage" class="empty">Todavía no hay registros.</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Nombre</th><th>Apellido</th><th>Edad</th><th>Acción</th></tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
    </section>
    <p class="notice">Los datos se guardan en este navegador mediante almacenamiento local (localStorage).</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
